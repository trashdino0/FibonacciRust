[package]
name = "fibonacci-rust"
version = "0.1.0"
edition = "2021"
description = "Huge Fibonacci numbers via fast doubling + 3-prime NTT (Rust port of fibonacciV2)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
anyhow = "1"
thiserror = "2"
# EXPERIMENT (Step 5 candidate): secure-thread-local allocator for the
# allocation-heavy parallel decimal phase. Keep iff decimal improves >=5%.
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
