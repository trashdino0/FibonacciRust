[package]
name = "fibonacci-rust"
version = "0.1.0"
edition = "2021"
description = "Huge Fibonacci numbers via fast doubling + 3-prime NTT (Rust port of fibonacciV2)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
thiserror = "2"
# Faster parallel allocator for allocation-heavy phases (measured);
# needs VS 2022 cl.exe at build time.
mimalloc = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
